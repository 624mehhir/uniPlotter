<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>UniPlotter</title>
<script>
  (function () {
    try {
      var stored = localStorage.getItem('uniplotter-theme');
      if (stored === 'light' || stored === 'dark') {
        document.documentElement.setAttribute('data-theme', stored);
      }
    } catch (e) {}
  })();
</script>
<style>
  :root {
    --bg: #f3f4f7;
    --grid-line: rgba(20, 24, 32, 0.045);
    --surface: #ffffff;
    --surface-2: #e9ebf0;
    --border: #d7dae1;
    --border-strong: #b9bec9;
    --text: #1c1f26;
    --text-dim: #5c6270;
    --text-faint: #868c99;
    --accent: #0e7c8b;
    --accent-strong: #0b6472;
    --accent-on: #ffffff;
    --warn-bg: #fdf3dc;
    --warn-border: #e3ae49;
    --warn-text: #7a5100;
    --error-bg: #fbe9e9;
    --error-border: #dd8384;
    --error-text: #8f1d1d;
    --shadow: 0 1px 2px rgba(20, 24, 32, 0.06), 0 8px 24px rgba(20, 24, 32, 0.05);
    --radius: 8px;
    --radius-sm: 5px;
  }

  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #13151a;
      --grid-line: rgba(255, 255, 255, 0.035);
      --surface: #1a1d24;
      --surface-2: #20242d;
      --border: #2c313c;
      --border-strong: #3b4250;
      --text: #e8eaf0;
      --text-dim: #9aa0af;
      --text-faint: #6b7181;
      --accent: #3fd0de;
      --accent-strong: #62dbe6;
      --accent-on: #062226;
      --warn-bg: #2a2210;
      --warn-border: #8a6a1f;
      --warn-text: #f0c15f;
      --error-bg: #2b1414;
      --error-border: #8a3a3a;
      --error-text: #f3999a;
      --shadow: 0 1px 2px rgba(0, 0, 0, 0.3), 0 8px 24px rgba(0, 0, 0, 0.35);
    }
  }

  :root[data-theme="dark"] {
    --bg: #13151a;
    --grid-line: rgba(255, 255, 255, 0.035);
    --surface: #1a1d24;
    --surface-2: #20242d;
    --border: #2c313c;
    --border-strong: #3b4250;
    --text: #e8eaf0;
    --text-dim: #9aa0af;
    --text-faint: #6b7181;
    --accent: #3fd0de;
    --accent-strong: #62dbe6;
    --accent-on: #062226;
    --warn-bg: #2a2210;
    --warn-border: #8a6a1f;
    --warn-text: #f0c15f;
    --error-bg: #2b1414;
    --error-border: #8a3a3a;
    --error-text: #f3999a;
    --shadow: 0 1px 2px rgba(0, 0, 0, 0.3), 0 8px 24px rgba(0, 0, 0, 0.35);
  }

  * { box-sizing: border-box; }

  .hidden { display: none !important; }

  html, body {
    background: var(--bg);
  }

  body {
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    color: var(--text);
    margin: 0;
    padding: 0 1.25rem 3rem;
    background-image:
      linear-gradient(var(--grid-line) 1px, transparent 1px),
      linear-gradient(90deg, var(--grid-line) 1px, transparent 1px);
    background-size: 28px 28px;
    background-attachment: fixed;
  }

  .mono {
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace;
  }

  a { color: inherit; }

  .page {
    max-width: min(1600px, 96vw);
    margin: 0 auto;
  }

  .topbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 1.75rem 0 1.25rem;
  }

  .brand {
    display: flex;
    flex-direction: column;
    gap: 0.15rem;
  }

  .brand-mark {
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace;
    font-size: 1.15rem;
    font-weight: 700;
    letter-spacing: 0.12em;
  }

  .brand-sub {
    font-size: 0.8rem;
    color: var(--text-dim);
    letter-spacing: 0.02em;
  }

  .icon-btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 2.5rem;
    height: 2.5rem;
    border-radius: var(--radius-sm);
    border: 1px solid var(--border);
    background: var(--surface);
    color: var(--text);
    cursor: pointer;
  }

  .icon-btn:hover {
    border-color: var(--border-strong);
  }

  .icon-btn svg {
    width: 1.2rem;
    height: 1.2rem;
  }

  .icon-moon { display: none; }

  :root[data-theme="dark"] .icon-sun { display: none; }
  :root[data-theme="dark"] .icon-moon { display: block; }

  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) .icon-sun { display: none; }
    :root:not([data-theme="light"]) .icon-moon { display: block; }
  }

  .layout {
    display: grid;
    grid-template-columns: minmax(260px, 300px) 1fr;
    gap: 1.25rem;
    align-items: start;
  }

  @media (max-width: 860px) {
    .layout {
      grid-template-columns: 1fr;
    }
  }

  .panel {
    min-width: 0;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    padding: 1.25rem;
  }

  .panel-title {
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace;
    font-size: 0.72rem;
    font-weight: 700;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--text-faint);
    margin: 0 0 1rem;
    padding-bottom: 0.75rem;
    border-bottom: 1px solid var(--border);
  }

  form {
    display: grid;
    gap: 1rem;
  }

  .field {
    min-width: 0;
  }

  .field-label {
    display: block;
    font-size: 0.82rem;
    font-weight: 600;
    margin-bottom: 0.4rem;
  }

  .file-control {
    display: flex;
    align-items: center;
    gap: 0.6rem;
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    background: var(--surface-2);
    padding: 0.35rem;
  }

  .file-control:focus-within {
    outline: 2px solid var(--accent);
    outline-offset: 1px;
  }

  .file-input {
    position: absolute;
    width: 1px;
    height: 1px;
    margin: -1px;
    padding: 0;
    overflow: hidden;
    clip: rect(0, 0, 0, 0);
    white-space: nowrap;
    border: 0;
  }

  .file-button {
    flex-shrink: 0;
    display: inline-flex;
    align-items: center;
    padding: 0.4rem 0.7rem;
    font-size: 0.78rem;
    font-weight: 600;
    letter-spacing: 0.02em;
    border-radius: 4px;
    background: var(--surface);
    border: 1px solid var(--border-strong);
    cursor: pointer;
    color: var(--text);
  }

  .file-button:hover {
    border-color: var(--accent);
    color: var(--accent);
  }

  .file-name {
    min-width: 0;
    font-size: 0.78rem;
    color: var(--text-faint);
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  .file-name.has-file {
    color: var(--text-dim);
  }

  select {
    width: 100%;
    appearance: none;
    -webkit-appearance: none;
    background-color: var(--surface-2);
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><path fill='%235c6270' d='M4 6l4 4 4-4z'/></svg>");
    background-repeat: no-repeat;
    background-position: right 0.7rem center;
    background-size: 0.85rem;
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    padding: 0.55rem 2rem 0.55rem 0.7rem;
    font-size: 0.88rem;
    color: var(--text);
    cursor: pointer;
  }

  select:hover { border-color: var(--border-strong); }

  input:focus-visible,
  select:focus-visible,
  button:focus-visible,
  a:focus-visible,
  .file-button:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
  }

  .btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 0.4rem;
    border-radius: var(--radius-sm);
    border: 1px solid transparent;
    font-size: 0.85rem;
    font-weight: 700;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    cursor: pointer;
    padding: 0.7rem 1rem;
  }

  .btn-primary {
    background: var(--accent);
    color: var(--accent-on);
  }

  .btn-primary:hover { background: var(--accent-strong); }

  .btn-primary:disabled {
    opacity: 0.6;
    cursor: default;
  }

  .btn-secondary {
    background: var(--surface-2);
    color: var(--text);
    border-color: var(--border-strong);
    text-decoration: none;
  }

  .btn-secondary:hover { border-color: var(--accent); color: var(--accent); }

  .output-panel {
    min-height: 320px;
    display: flex;
    flex-direction: column;
  }

  .output-empty {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    color: var(--text-faint);
    font-size: 0.85rem;
    padding: 3rem 1rem;
    border: 1px dashed var(--border);
    border-radius: var(--radius-sm);
  }

  .status-bar {
    display: flex;
    gap: 0.6rem;
    align-items: flex-start;
    border-radius: var(--radius-sm);
    border: 1px solid;
    padding: 0.75rem 0.9rem;
    font-size: 0.85rem;
    margin-bottom: 1rem;
  }

  .status-bar-icon {
    flex-shrink: 0;
    width: 1rem;
    height: 1rem;
    margin-top: 0.1rem;
  }

  .status-error {
    background: var(--error-bg);
    border-color: var(--error-border);
    color: var(--error-text);
  }

  .status-warning {
    background: var(--warn-bg);
    border-color: var(--warn-border);
    color: var(--warn-text);
  }

  .status-bar strong {
    display: block;
    font-size: 0.72rem;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    margin-bottom: 0.3rem;
  }

  .status-bar ul {
    margin: 0;
    padding-left: 1.1rem;
  }

  .status-bar li + li { margin-top: 0.2rem; }

  .result {
    display: flex;
    flex-direction: column;
    gap: 1rem;
  }

  .carousel {
    min-width: 0;
    display: flex;
    flex-direction: column;
    gap: 1rem;
  }

  .carousel-toolbar {
    min-width: 0;
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    justify-content: space-between;
    gap: 0.75rem;
  }

  .batch-status {
    font-size: 0.8rem;
    color: var(--text-faint);
  }

  .carousel-nav {
    display: flex;
    align-items: center;
    gap: 0.5rem;
  }

  .carousel-nav .icon-btn {
    width: 2rem;
    height: 2rem;
  }

  .carousel-nav .icon-btn svg {
    width: 1rem;
    height: 1rem;
  }

  .carousel-nav .icon-btn:disabled {
    opacity: 0.35;
    cursor: default;
  }

  .position-indicator {
    font-size: 0.78rem;
    color: var(--text-faint);
    min-width: 4rem;
    text-align: center;
  }

  .slide-card {
    min-width: 0;
    display: flex;
    flex-direction: column;
    gap: 1rem;
  }

  .card-header {
    min-width: 0;
    display: flex;
    align-items: center;
  }

  .card-header-name {
    min-width: 0;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    font-size: 0.8rem;
    color: var(--text-dim);
  }

  .frame {
    position: relative;
    display: inline-block;
    max-width: 100%;
    margin: 0.35rem auto 0.1rem;
  }

  .frame img {
    display: block;
    max-width: 100%;
    max-height: 58vh;
    height: auto;
    border-radius: 2px;
    cursor: zoom-in;
  }

  .corner {
    position: absolute;
    width: 16px;
    height: 16px;
    border: 0 solid var(--accent);
    pointer-events: none;
  }

  .corner-tl { top: -7px; left: -7px; border-top-width: 2px; border-left-width: 2px; }
  .corner-tr { top: -7px; right: -7px; border-top-width: 2px; border-right-width: 2px; }
  .corner-bl { bottom: -7px; left: -7px; border-bottom-width: 2px; border-left-width: 2px; }
  .corner-br { bottom: -7px; right: -7px; border-bottom-width: 2px; border-right-width: 2px; }

  .expand-btn {
    position: absolute;
    top: 0.5rem;
    right: 0.5rem;
    width: 2.1rem;
    height: 2.1rem;
    background: rgba(20, 22, 26, 0.55);
    border-color: rgba(255, 255, 255, 0.35);
    color: #fff;
    z-index: 2;
  }

  .expand-btn:hover {
    background: rgba(20, 22, 26, 0.75);
    border-color: #fff;
  }

  .zip-controls {
    display: flex;
    align-items: center;
    gap: 0.5rem;
  }

  .download-row {
    display: flex;
    align-items: center;
    gap: 0.5rem;
  }

  .dl-format {
    width: auto;
    padding: 0.4rem 1.7rem 0.4rem 0.6rem;
    font-size: 0.78rem;
  }

  .fullscreen-overlay {
    position: fixed;
    inset: 0;
    background: rgba(8, 9, 11, 0.94);
    z-index: 1000;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .fullscreen-overlay.hidden { display: none !important; }

  .fullscreen-img {
    max-width: 92vw;
    max-height: 92vh;
    object-fit: contain;
    border-radius: 2px;
    touch-action: none;
    -webkit-user-drag: none;
    user-select: none;
  }

  .fullscreen-zoom-controls {
    position: absolute;
    top: 1.25rem;
    left: 1.25rem;
    z-index: 2;
    display: flex;
    align-items: center;
    gap: 0.4rem;
  }

  .fullscreen-zoom-btn {
    width: 2.1rem;
    height: 2.1rem;
    background: rgba(255, 255, 255, 0.1);
    border-color: rgba(255, 255, 255, 0.3);
    color: #fff;
    font-size: 1.1rem;
    font-weight: 700;
    line-height: 1;
  }

  .fullscreen-zoom-btn:hover { border-color: #fff; }
  .fullscreen-zoom-btn:disabled { opacity: 0.3; cursor: default; }

  .fullscreen-zoom-level {
    color: #f1f2f5;
    font-size: 0.75rem;
    min-width: 3rem;
    text-align: center;
  }

  .fullscreen-close {
    position: absolute;
    top: 1.25rem;
    right: 1.25rem;
    z-index: 2;
    background: rgba(255, 255, 255, 0.1);
    border-color: rgba(255, 255, 255, 0.3);
    color: #fff;
  }

  .fullscreen-close:hover { border-color: #fff; }

  .fullscreen-nav {
    position: absolute;
    top: 50%;
    transform: translateY(-50%);
    z-index: 2;
    width: 2.8rem;
    height: 2.8rem;
    background: rgba(255, 255, 255, 0.1);
    border-color: rgba(255, 255, 255, 0.3);
    color: #fff;
  }

  .fullscreen-nav:hover { border-color: #fff; }
  .fullscreen-nav:disabled { opacity: 0.3; cursor: default; }
  .fullscreen-nav.hidden { display: none !important; }

  .fullscreen-prev { left: 1.25rem; }
  .fullscreen-next { right: 1.25rem; }

  .fullscreen-position {
    position: absolute;
    bottom: 1.25rem;
    left: 50%;
    transform: translateX(-50%);
    z-index: 2;
    color: #f1f2f5;
    font-size: 0.8rem;
    opacity: 0.85;
  }

  .result-toolbar {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    justify-content: space-between;
    gap: 0.75rem;
    border-top: 1px solid var(--border);
    padding-top: 0.9rem;
  }

  .stats {
    display: flex;
    gap: 1.25rem;
    margin: 0;
  }

  .stats div {
    display: flex;
    flex-direction: column;
    gap: 0.1rem;
  }

  .stats dt {
    font-size: 0.68rem;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--text-faint);
  }

  .stats dd {
    margin: 0;
    font-size: 1.1rem;
    font-weight: 700;
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace;
  }

  footer {
    margin-top: 2rem;
    text-align: center;
    font-size: 0.75rem;
    color: var(--text-faint);
  }

  @media (prefers-reduced-motion: reduce) {
    * {
      transition: none !important;
      animation: none !important;
    }
  }

  @media (prefers-reduced-motion: no-preference) {
    .icon-btn, .file-button, .btn, select, .file-control {
      transition: border-color 150ms ease, color 150ms ease, background-color 150ms ease;
    }
  }
</style>
</head>
<body>
<div class="page">
  <header class="topbar">
    <div class="brand">
      <span class="brand-mark">UNIPLOTTER</span>
      <span class="brand-sub">Annotation verification instrument</span>
    </div>
    <button id="themeToggle" class="icon-btn" type="button" aria-label="Toggle color theme" aria-pressed="false">
      <svg class="icon icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
        <circle cx="12" cy="12" r="4"></circle>
        <path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"></path>
      </svg>
      <svg class="icon icon-moon" viewBox="0 0 24 24" fill="currentColor">
        <path d="M20.4 14.7A8.5 8.5 0 019.3 3.6a.6.6 0 00-.7-.8A9.5 9.5 0 1021.2 15.4a.6.6 0 00-.8-.7z"></path>
      </svg>
    </button>
  </header>

  <main class="layout">
    <section class="panel input-panel">
      <h2 class="panel-title">Input</h2>
      <form id="plotForm">
        <div class="field">
          <label class="field-label" for="image">Image file(s)</label>
          <div class="file-control">
            <input type="file" id="image" name="image" accept="image/*" required multiple class="file-input">
            <label for="image" class="file-button">Browse</label>
            <span class="file-name" id="imageFileName">No file selected</span>
          </div>
        </div>

        <div class="field">
          <label class="field-label" for="format">Format</label>
          <select id="format" name="format" required>
            <option value="coco">COCO</option>
            <option value="yolo">YOLO</option>
            <option value="voc">Pascal VOC</option>
            <option value="labelme">LabelMe</option>
            <option value="labelstudio">Label Studio</option>
            <option value="cvat">CVAT</option>
            <option value="lekhana">Lekhana</option>
          </select>
        </div>

        <div class="field">
          <label class="field-label" for="annotation">Annotation file</label>
          <div class="file-control">
            <input type="file" id="annotation" name="annotation" required class="file-input" accept=".json">
            <label for="annotation" class="file-button">Browse</label>
            <span class="file-name" id="annotationFileName">No file selected</span>
          </div>
        </div>

        <div id="classesField" class="field hidden">
          <label class="field-label" for="classes">Classes file (classes.txt)</label>
          <div class="file-control">
            <input type="file" id="classes" name="classes" class="file-input" accept=".txt">
            <label for="classes" class="file-button">Browse</label>
            <span class="file-name" id="classesFileName">No file selected</span>
          </div>
        </div>

        <button type="submit" class="btn btn-primary" id="submitBtn">Plot</button>
      </form>
    </section>

    <section class="panel output-panel" aria-live="polite">
      <h2 class="panel-title">Output</h2>

      <div id="outputEmpty" class="output-empty">
        Upload one or more images and an annotation file, then Plot to see results here.
      </div>

      <div id="carousel" class="carousel hidden">
        <div class="carousel-toolbar">
          <div id="batchStatus" class="batch-status mono hidden"></div>
          <div class="carousel-nav">
            <button id="prevBtn" type="button" class="icon-btn" aria-label="Previous image">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
            </button>
            <span id="positionIndicator" class="position-indicator mono"></span>
            <button id="nextBtn" type="button" class="icon-btn" aria-label="Next image">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18l6-6-6-6"/></svg>
            </button>
          </div>
          <div id="zipControls" class="zip-controls hidden">
            <select id="zipFormatSelect" class="dl-format mono" aria-label="Download All format">
              <option value="png">PNG</option>
              <option value="jpg">JPG</option>
            </select>
            <button id="downloadAllBtn" type="button" class="btn btn-secondary">Download All (ZIP)</button>
          </div>
        </div>

        <div id="slideCard" class="slide-card"></div>
      </div>
    </section>
  </main>

  <footer>UniPlotter &mdash; stateless annotation verification, 7 formats</footer>
</div>

<div id="fullscreenOverlay" class="fullscreen-overlay hidden" role="dialog" aria-modal="true" aria-label="Plotted image, fullscreen">
  <div class="fullscreen-zoom-controls">
    <button id="zoomOutBtn" type="button" class="icon-btn fullscreen-zoom-btn" aria-label="Zoom out">&minus;</button>
    <span id="zoomLevelIndicator" class="fullscreen-zoom-level mono">100%</span>
    <button id="zoomInBtn" type="button" class="icon-btn fullscreen-zoom-btn" aria-label="Zoom in">+</button>
  </div>
  <button id="fullscreenClose" type="button" class="icon-btn fullscreen-close" aria-label="Close fullscreen">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>
  </button>
  <button id="fullscreenPrev" type="button" class="icon-btn fullscreen-nav fullscreen-prev" aria-label="Previous image">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
  </button>
  <img id="fullscreenImg" class="fullscreen-img" alt="" draggable="false">
  <button id="fullscreenNext" type="button" class="icon-btn fullscreen-nav fullscreen-next" aria-label="Next image">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18l6-6-6-6"/></svg>
  </button>
  <div id="fullscreenPosition" class="fullscreen-position mono"></div>
</div>

<script>
  (function themeToggleInit() {
    const root = document.documentElement;
    const toggle = document.getElementById('themeToggle');

    function currentTheme() {
      const attr = root.getAttribute('data-theme');
      if (attr) return attr;
      return window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
    }

    function syncToggleState() {
      toggle.setAttribute('aria-pressed', currentTheme() === 'dark' ? 'true' : 'false');
    }

    toggle.addEventListener('click', () => {
      const next = currentTheme() === 'dark' ? 'light' : 'dark';
      root.setAttribute('data-theme', next);
      try {
        localStorage.setItem('uniplotter-theme', next);
      } catch (e) {}
      syncToggleState();
    });

    syncToggleState();
  })();

  const formatSelect = document.getElementById('format');
  const classesField = document.getElementById('classesField');
  const classesInput = document.getElementById('classes');
  const imageInput = document.getElementById('image');
  const form = document.getElementById('plotForm');
  const submitBtn = document.getElementById('submitBtn');
  const outputEmpty = document.getElementById('outputEmpty');
  const batchStatus = document.getElementById('batchStatus');
  const carousel = document.getElementById('carousel');
  const slideCard = document.getElementById('slideCard');
  const prevBtn = document.getElementById('prevBtn');
  const nextBtn = document.getElementById('nextBtn');
  const positionIndicator = document.getElementById('positionIndicator');
  const zipControls = document.getElementById('zipControls');
  const zipFormatSelect = document.getElementById('zipFormatSelect');
  const downloadAllBtn = document.getElementById('downloadAllBtn');
  const fullscreenOverlay = document.getElementById('fullscreenOverlay');
  const fullscreenImg = document.getElementById('fullscreenImg');
  const fullscreenClose = document.getElementById('fullscreenClose');
  const fullscreenPrev = document.getElementById('fullscreenPrev');
  const fullscreenNext = document.getElementById('fullscreenNext');
  const fullscreenPosition = document.getElementById('fullscreenPosition');
  const zoomInBtn = document.getElementById('zoomInBtn');
  const zoomOutBtn = document.getElementById('zoomOutBtn');
  const zoomLevelIndicator = document.getElementById('zoomLevelIndicator');

  function wireFileNameDisplay(inputId, labelId) {
    const input = document.getElementById(inputId);
    const label = document.getElementById(labelId);
    input.addEventListener('change', () => {
      if (input.files && input.files[0]) {
        label.textContent = input.files[0].name;
        label.classList.add('has-file');
      } else {
        label.textContent = 'No file selected';
        label.classList.remove('has-file');
      }
    });
  }

  function wireImageFileNameDisplay() {
    const label = document.getElementById('imageFileName');
    imageInput.addEventListener('change', () => {
      const files = imageInput.files;
      if (files && files.length > 0) {
        label.textContent = files.length === 1 ? files[0].name : `${files.length} files selected`;
        label.classList.add('has-file');
      } else {
        label.textContent = 'No file selected';
        label.classList.remove('has-file');
      }
    });
  }
  wireImageFileNameDisplay();
  wireFileNameDisplay('annotation', 'annotationFileName');
  wireFileNameDisplay('classes', 'classesFileName');

  function updateClassesVisibility() {
    if (formatSelect.value === 'yolo') {
      classesField.classList.remove('hidden');
    } else {
      classesField.classList.add('hidden');
      classesInput.value = '';
      document.getElementById('classesFileName').textContent = 'No file selected';
      document.getElementById('classesFileName').classList.remove('has-file');
    }
  }
  formatSelect.addEventListener('change', updateClassesVisibility);
  updateClassesVisibility();

  const ANNOTATION_ACCEPT = {
    coco: '.json',
    labelme: '.json',
    labelstudio: '.json',
    lekhana: '.json',
    voc: '.xml',
    cvat: '.xml',
    yolo: '.txt',
  };
  const annotationInput = document.getElementById('annotation');

  function updateAnnotationAccept() {
    annotationInput.setAttribute('accept', ANNOTATION_ACCEPT[formatSelect.value] || '');
  }
  formatSelect.addEventListener('change', updateAnnotationAccept);
  updateAnnotationAccept();

  function buildErrorBody(message) {
    const bar = document.createElement('div');
    bar.className = 'status-bar status-error';
    bar.setAttribute('role', 'alert');
    bar.innerHTML = `
      <svg class="status-bar-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="9"></circle>
        <path d="M12 8v5M12 16h.01"></path>
      </svg>
      <div><strong>Error</strong><div class="card-error-text"></div></div>
    `;
    bar.querySelector('.card-error-text').textContent = message;
    return bar;
  }

  function buildPendingBody() {
    const bar = document.createElement('div');
    bar.className = 'output-empty';
    bar.textContent = 'Plotting…';
    return bar;
  }

  function buildSuccessBody(data) {
    const frag = document.createDocumentFragment();

    if (data.warnings && data.warnings.length > 0) {
      const warn = document.createElement('div');
      warn.className = 'status-bar status-warning';
      warn.innerHTML = `
        <svg class="status-bar-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 3l10 18H2z"></path>
          <path d="M12 10v4M12 17h.01"></path>
        </svg>
        <div><strong>Warnings</strong><ul class="card-warnings-list"></ul></div>
      `;
      const ul = warn.querySelector('.card-warnings-list');
      data.warnings.forEach((w) => {
        const li = document.createElement('li');
        li.textContent = w;
        ul.appendChild(li);
      });
      frag.appendChild(warn);
    }

    const dataUrl = `data:${data.media_type};base64,${data.image_base64}`;

    const result = document.createElement('div');
    result.className = 'result';

    const frame = document.createElement('div');
    frame.className = 'frame';
    frame.innerHTML = `
      <span class="corner corner-tl"></span>
      <span class="corner corner-tr"></span>
      <span class="corner corner-bl"></span>
      <span class="corner corner-br"></span>
    `;
    const img = document.createElement('img');
    img.src = dataUrl;
    img.alt = data.filename;
    img.addEventListener('dblclick', openFullscreen);
    frame.appendChild(img);

    const expandBtn = document.createElement('button');
    expandBtn.type = 'button';
    expandBtn.className = 'icon-btn expand-btn';
    expandBtn.setAttribute('aria-label', 'View fullscreen');
    expandBtn.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 3H5a2 2 0 00-2 2v3M16 3h3a2 2 0 012 2v3M8 21H5a2 2 0 01-2-2v-3M16 21h3a2 2 0 002-2v-3"/></svg>';
    expandBtn.addEventListener('click', openFullscreen);
    frame.appendChild(expandBtn);

    result.appendChild(frame);

    const toolbar = document.createElement('div');
    toolbar.className = 'result-toolbar';

    const downloadRow = document.createElement('div');
    downloadRow.className = 'download-row';

    const downloadFormat = document.createElement('select');
    downloadFormat.className = 'dl-format mono';
    downloadFormat.setAttribute('aria-label', 'Download format');
    downloadFormat.innerHTML = '<option value="png">PNG</option><option value="jpg">JPG</option>';

    const downloadBtn = document.createElement('button');
    downloadBtn.type = 'button';
    downloadBtn.className = 'btn btn-secondary';
    downloadBtn.textContent = 'Download';
    downloadBtn.addEventListener('click', async () => {
      downloadBtn.disabled = true;
      try {
        await downloadImage(data, downloadFormat.value);
      } finally {
        downloadBtn.disabled = false;
      }
    });

    downloadRow.appendChild(downloadFormat);
    downloadRow.appendChild(downloadBtn);
    toolbar.appendChild(downloadRow);

    const stats = document.createElement('dl');
    stats.className = 'stats mono';
    stats.innerHTML = `
      <div><dt>Plotted</dt><dd class="stat-plotted"></dd></div>
      <div><dt>Skipped</dt><dd class="stat-skipped"></dd></div>
    `;
    stats.querySelector('.stat-plotted').textContent = data.annotation_count;
    stats.querySelector('.stat-skipped').textContent = data.skipped_count;
    toolbar.appendChild(stats);

    result.appendChild(toolbar);
    frag.appendChild(result);

    return frag;
  }

  // ---- Carousel state ----

  let slides = [];        // { filename, status: 'pending'|'success'|'error', data, message }
  let currentIndex = 0;
  let maxReachedIndex = -1;
  let batchRunning = false;

  function renderSlide() {
    if (slides.length === 0) {
      carousel.classList.add('hidden');
      outputEmpty.classList.remove('hidden');
      return;
    }
    outputEmpty.classList.add('hidden');
    carousel.classList.remove('hidden');

    const slide = slides[currentIndex];

    slideCard.innerHTML = '';
    const header = document.createElement('div');
    header.className = 'card-header';
    const name = document.createElement('span');
    name.className = 'card-header-name mono';
    name.textContent = slide.filename;
    header.appendChild(name);
    slideCard.appendChild(header);

    if (slide.status === 'pending') {
      slideCard.appendChild(buildPendingBody());
    } else if (slide.status === 'error') {
      slideCard.appendChild(buildErrorBody(slide.message));
    } else {
      slideCard.appendChild(buildSuccessBody(slide.data));
    }

    const multi = slides.length > 1;
    prevBtn.classList.toggle('hidden', !multi);
    nextBtn.classList.toggle('hidden', !multi);
    positionIndicator.classList.toggle('hidden', !multi);
    zipControls.classList.toggle('hidden', !multi);

    if (multi) {
      positionIndicator.textContent = `${currentIndex + 1} of ${slides.length}`;
      prevBtn.disabled = currentIndex <= 0;
      const upperBound = batchRunning ? maxReachedIndex : slides.length - 1;
      nextBtn.disabled = currentIndex >= upperBound;
      downloadAllBtn.disabled = batchRunning;
    }

    if (!fullscreenOverlay.classList.contains('hidden')) {
      updateFullscreen();
    }
  }

  prevBtn.addEventListener('click', () => {
    if (currentIndex > 0) {
      currentIndex--;
      renderSlide();
    }
  });

  nextBtn.addEventListener('click', () => {
    const upperBound = batchRunning ? maxReachedIndex : slides.length - 1;
    if (currentIndex < upperBound) {
      currentIndex++;
      renderSlide();
    }
  });

  // ---- Fullscreen viewer ----

  let fullscreenShownIndex = -1;

  function updateFullscreen() {
    const slide = slides[currentIndex];
    if (currentIndex !== fullscreenShownIndex) {
      resetZoom();
      fullscreenShownIndex = currentIndex;
    }
    if (slide && slide.status === 'success') {
      fullscreenImg.src = `data:${slide.data.media_type};base64,${slide.data.image_base64}`;
      fullscreenImg.alt = slide.data.filename;
    }

    const multi = slides.length > 1;
    fullscreenPosition.textContent = multi ? `${currentIndex + 1} of ${slides.length}` : '';
    fullscreenPrev.classList.toggle('hidden', !multi);
    fullscreenNext.classList.toggle('hidden', !multi);
    if (multi) {
      const upperBound = batchRunning ? maxReachedIndex : slides.length - 1;
      fullscreenPrev.disabled = currentIndex <= 0;
      fullscreenNext.disabled = currentIndex >= upperBound;
    }
  }

  function openFullscreen() {
    const slide = slides[currentIndex];
    if (!slide || slide.status !== 'success') return;
    fullscreenShownIndex = -1;
    fullscreenOverlay.classList.remove('hidden');
    document.body.style.overflow = 'hidden';
    updateFullscreen();
  }

  function closeFullscreen() {
    fullscreenOverlay.classList.add('hidden');
    document.body.style.overflow = '';
    resetZoom();
    fullscreenShownIndex = -1;
  }

  // ---- Fullscreen zoom / pan ----

  const ZOOM_MIN = 1;
  const ZOOM_MAX = 4;
  const ZOOM_STEP = 0.5;

  let zoomLevel = 1;
  let panX = 0;
  let panY = 0;
  let isPanning = false;
  let panPointerId = null;
  let panStartClientX = 0;
  let panStartClientY = 0;
  let panOriginX = 0;
  let panOriginY = 0;

  function clampPan() {
    // The image's own unscaled layout box is the reference "viewport" for
    // panning: at zoomLevel, the scaled box overflows that footprint by
    // (size*zoomLevel - size), so panning past half that overflow in either
    // direction would pull the image's edge in from where it used to reach.
    if (zoomLevel <= ZOOM_MIN) {
      panX = 0;
      panY = 0;
      return;
    }
    const boxWidth = fullscreenImg.offsetWidth;
    const boxHeight = fullscreenImg.offsetHeight;
    const maxPanX = Math.max(0, (boxWidth * zoomLevel - boxWidth) / 2);
    const maxPanY = Math.max(0, (boxHeight * zoomLevel - boxHeight) / 2);
    panX = Math.min(maxPanX, Math.max(-maxPanX, panX));
    panY = Math.min(maxPanY, Math.max(-maxPanY, panY));
  }

  function applyZoomTransform() {
    fullscreenImg.style.transform = `translate(${panX}px, ${panY}px) scale(${zoomLevel})`;
    fullscreenImg.style.cursor = zoomLevel > ZOOM_MIN ? (isPanning ? 'grabbing' : 'grab') : 'default';
    zoomLevelIndicator.textContent = `${Math.round(zoomLevel * 100)}%`;
    zoomOutBtn.disabled = zoomLevel <= ZOOM_MIN;
    zoomInBtn.disabled = zoomLevel >= ZOOM_MAX;
  }

  function resetZoom() {
    zoomLevel = ZOOM_MIN;
    panX = 0;
    panY = 0;
    isPanning = false;
    clampPan();
    applyZoomTransform();
  }

  function setZoom(next) {
    zoomLevel = Math.min(ZOOM_MAX, Math.max(ZOOM_MIN, next));
    clampPan();
    applyZoomTransform();
  }

  zoomInBtn.addEventListener('click', () => setZoom(zoomLevel + ZOOM_STEP));
  zoomOutBtn.addEventListener('click', () => setZoom(zoomLevel - ZOOM_STEP));

  fullscreenOverlay.addEventListener('wheel', (event) => {
    if (fullscreenOverlay.classList.contains('hidden')) return;
    event.preventDefault();
    setZoom(zoomLevel + (event.deltaY < 0 ? ZOOM_STEP : -ZOOM_STEP));
  }, { passive: false });

  fullscreenImg.addEventListener('pointerdown', (event) => {
    if (zoomLevel <= ZOOM_MIN) return;
    isPanning = true;
    panPointerId = event.pointerId;
    panStartClientX = event.clientX;
    panStartClientY = event.clientY;
    panOriginX = panX;
    panOriginY = panY;
    fullscreenImg.setPointerCapture(event.pointerId);
    applyZoomTransform();
  });

  fullscreenImg.addEventListener('pointermove', (event) => {
    if (!isPanning || event.pointerId !== panPointerId) return;
    panX = panOriginX + (event.clientX - panStartClientX);
    panY = panOriginY + (event.clientY - panStartClientY);
    clampPan();
    applyZoomTransform();
  });

  function endPan(event) {
    if (!isPanning || event.pointerId !== panPointerId) return;
    isPanning = false;
    panPointerId = null;
    applyZoomTransform();
  }
  fullscreenImg.addEventListener('pointerup', endPan);
  fullscreenImg.addEventListener('pointercancel', endPan);

  fullscreenClose.addEventListener('click', closeFullscreen);

  fullscreenOverlay.addEventListener('click', (event) => {
    if (event.target === fullscreenOverlay) closeFullscreen();
  });

  document.addEventListener('keydown', (event) => {
    if (fullscreenOverlay.classList.contains('hidden')) return;
    if (event.key === 'Escape') {
      closeFullscreen();
    } else if (event.key === 'ArrowLeft') {
      fullscreenPrev.click();
    } else if (event.key === 'ArrowRight') {
      fullscreenNext.click();
    }
  });

  fullscreenPrev.addEventListener('click', () => {
    if (currentIndex > 0) {
      currentIndex--;
      renderSlide();
    }
  });

  fullscreenNext.addEventListener('click', () => {
    const upperBound = batchRunning ? maxReachedIndex : slides.length - 1;
    if (currentIndex < upperBound) {
      currentIndex++;
      renderSlide();
    }
  });

  // ---- PNG -> JPEG conversion (canvas, client-side only; /plot still returns PNG) ----

  function pngBase64ToJpegBytes(base64, quality) {
    return new Promise((resolve, reject) => {
      const image = new Image();
      image.onload = () => {
        const canvas = document.createElement('canvas');
        canvas.width = image.naturalWidth;
        canvas.height = image.naturalHeight;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(image, 0, 0);
        canvas.toBlob((blob) => {
          if (!blob) {
            reject(new Error('JPEG conversion failed'));
            return;
          }
          blob.arrayBuffer().then((buf) => resolve(new Uint8Array(buf)));
        }, 'image/jpeg', quality);
      };
      image.onerror = () => reject(new Error('Failed to load image for JPEG conversion'));
      image.src = `data:image/png;base64,${base64}`;
    });
  }

  function withExtension(filename, ext) {
    return filename.replace(/\.[^./\\]+$/, '') + '.' + ext;
  }

  function triggerBlobDownload(blob, filename) {
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = filename;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
  }

  async function downloadImage(data, format) {
    if (format === 'jpg') {
      const jpegBytes = await pngBase64ToJpegBytes(data.image_base64, 0.92);
      triggerBlobDownload(new Blob([jpegBytes], { type: 'image/jpeg' }), withExtension(data.filename, 'jpg'));
    } else {
      triggerBlobDownload(new Blob([base64ToBytes(data.image_base64)], { type: 'image/png' }), data.filename);
    }
  }

  // ---- ZIP encoding (STORE method, hand-written — no library/CDN) ----

  function crc32(bytes) {
    let crc = ~0;
    for (let i = 0; i < bytes.length; i++) {
      crc ^= bytes[i];
      for (let j = 0; j < 8; j++) {
        crc = (crc >>> 1) ^ (0xedb88320 & -(crc & 1));
      }
    }
    return (~crc) >>> 0;
  }

  function dosDateTime() {
    const now = new Date();
    const time = ((now.getHours() & 0x1f) << 11) | ((now.getMinutes() & 0x3f) << 5) | ((Math.floor(now.getSeconds() / 2)) & 0x1f);
    const date = (((now.getFullYear() - 1980) & 0x7f) << 9) | (((now.getMonth() + 1) & 0xf) << 5) | (now.getDate() & 0x1f);
    return { time, date };
  }

  function buildZip(entries) {
    const encoder = new TextEncoder();
    const { time, date } = dosDateTime();
    const localParts = [];
    const centralParts = [];
    let offset = 0;

    entries.forEach(({ name, data }) => {
      const nameBytes = encoder.encode(name);
      const crc = crc32(data);
      const size = data.length;

      const local = new DataView(new ArrayBuffer(30));
      local.setUint32(0, 0x04034b50, true);
      local.setUint16(4, 20, true);
      local.setUint16(6, 0, true);
      local.setUint16(8, 0, true);
      local.setUint16(10, time, true);
      local.setUint16(12, date, true);
      local.setUint32(14, crc, true);
      local.setUint32(18, size, true);
      local.setUint32(22, size, true);
      local.setUint16(26, nameBytes.length, true);
      local.setUint16(28, 0, true);

      const localHeaderOffset = offset;
      localParts.push(new Uint8Array(local.buffer), nameBytes, data);
      offset += 30 + nameBytes.length + size;

      const central = new DataView(new ArrayBuffer(46));
      central.setUint32(0, 0x02014b50, true);
      central.setUint16(4, 20, true);
      central.setUint16(6, 20, true);
      central.setUint16(8, 0, true);
      central.setUint16(10, 0, true);
      central.setUint16(12, time, true);
      central.setUint16(14, date, true);
      central.setUint32(16, crc, true);
      central.setUint32(20, size, true);
      central.setUint32(24, size, true);
      central.setUint16(28, nameBytes.length, true);
      central.setUint16(30, 0, true);
      central.setUint16(32, 0, true);
      central.setUint16(34, 0, true);
      central.setUint16(36, 0, true);
      central.setUint32(38, 0, true);
      central.setUint32(42, localHeaderOffset, true);

      centralParts.push(new Uint8Array(central.buffer), nameBytes);
    });

    const centralDirOffset = offset;
    let centralDirSize = 0;
    centralParts.forEach((p) => { centralDirSize += p.length; });

    const eocd = new DataView(new ArrayBuffer(22));
    eocd.setUint32(0, 0x06054b50, true);
    eocd.setUint16(4, 0, true);
    eocd.setUint16(6, 0, true);
    eocd.setUint16(8, entries.length, true);
    eocd.setUint16(10, entries.length, true);
    eocd.setUint32(12, centralDirSize, true);
    eocd.setUint32(16, centralDirOffset, true);
    eocd.setUint16(20, 0, true);

    return new Blob([...localParts, ...centralParts, new Uint8Array(eocd.buffer)], { type: 'application/zip' });
  }

  function base64ToBytes(base64) {
    const binary = atob(base64);
    const bytes = new Uint8Array(binary.length);
    for (let i = 0; i < binary.length; i++) {
      bytes[i] = binary.charCodeAt(i);
    }
    return bytes;
  }

  downloadAllBtn.addEventListener('click', async () => {
    const successSlides = slides.filter((s) => s.status === 'success');
    if (successSlides.length === 0) return;

    downloadAllBtn.disabled = true;
    try {
      const format = zipFormatSelect.value;
      const entries = [];
      for (const s of successSlides) {
        if (format === 'jpg') {
          const jpegBytes = await pngBase64ToJpegBytes(s.data.image_base64, 0.92);
          entries.push({ name: withExtension(s.data.filename, 'jpg'), data: jpegBytes });
        } else {
          entries.push({ name: s.data.filename, data: base64ToBytes(s.data.image_base64) });
        }
      }
      const blob = buildZip(entries);
      triggerBlobDownload(blob, 'uniplotter_batch.zip');
    } finally {
      downloadAllBtn.disabled = false;
    }
  });

  // ---- Submit / plotting loop ----

  function naturalCompare(a, b) {
    return a.localeCompare(b, undefined, { numeric: true, sensitivity: 'base' });
  }

  form.addEventListener('submit', async (event) => {
    event.preventDefault();

    const images = Array.from(imageInput.files || []).sort((a, b) => naturalCompare(a.name, b.name));
    const annotationFile = document.getElementById('annotation').files[0];
    const format = formatSelect.value;
    const classesFile = format === 'yolo' && classesInput.files[0] ? classesInput.files[0] : null;

    slides = images.map((image) => ({ filename: image.name, status: 'pending', data: null, message: null }));
    currentIndex = 0;
    maxReachedIndex = -1;
    batchRunning = true;

    submitBtn.disabled = true;
    submitBtn.textContent = 'Plotting…';
    batchStatus.classList.remove('hidden');
    renderSlide();

    for (let i = 0; i < images.length; i++) {
      const image = images[i];
      maxReachedIndex = i;
      currentIndex = i;
      batchStatus.textContent = images.length > 1 ? `Plotting ${i + 1} of ${images.length}…` : 'Plotting…';
      renderSlide();

      const formData = new FormData();
      formData.append('image', image);
      formData.append('annotation', annotationFile);
      formData.append('format', format);
      if (classesFile) {
        formData.append('classes', classesFile);
      }

      try {
        const response = await fetch('/plot', {
          method: 'POST',
          body: formData,
        });
        const data = await response.json();
        if (response.ok) {
          slides[i].status = 'success';
          slides[i].data = data;
        } else {
          slides[i].status = 'error';
          slides[i].message = data.detail || 'Request failed.';
        }
      } catch (err) {
        slides[i].status = 'error';
        slides[i].message = 'Request failed: ' + err.message;
      }

      currentIndex = i;
      renderSlide();
    }

    batchRunning = false;
    batchStatus.classList.add('hidden');
    submitBtn.disabled = false;
    submitBtn.textContent = 'Plot';
    currentIndex = 0;
    renderSlide();
  });
</script>
</body>
</html>
